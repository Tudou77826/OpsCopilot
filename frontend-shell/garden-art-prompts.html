<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>养成素材绘图提示词生成器</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --panel-2: #22262e; --line: #313640;
    --text: #e6e8ec; --muted: #9aa2af; --accent: #7aa2f7; --skeleton: #e0af68; --ok: #7bd88f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--text); font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  aside { width: 420px; flex: 0 0 420px; height: 100%; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 14px 14px 60px; }
  main { flex: 1 1 auto; height: 100%; overflow-y: auto; padding: 16px 20px 80px; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  h2 { font-size: 12px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  h2:first-of-type { border-top: 0; padding-top: 0; }
  .hint { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  label.field { display: block; margin: 8px 0; }
  label.field > span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  input[type=text], textarea, select {
    width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 7px; font: inherit; resize: vertical;
  }
  textarea { min-height: 54px; line-height: 1.5; }
  .stage-row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .stage-row b { flex: 0 0 46px; color: var(--muted); font-weight: 400; font-size: 12px; }
  .stage-row input[type=text] { flex: 0 0 78px; }
  .stage-row textarea { flex: 1 1 auto; min-height: 34px; }
  details { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; background: var(--panel-2); }
  details > summary { cursor: pointer; padding: 8px 10px; font-weight: 600; }
  details > div { padding: 4px 10px 12px; }
  details.skeleton > summary { color: var(--skeleton); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #2b3b5e; border-color: #3d558a; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  section.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  section.card h3 { font-size: 13px; margin: 0; }
  section.card .meta { color: var(--muted); font-size: 12px; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0; font: 12px/1.65 Consolas, "Cascadia Mono", monospace; max-height: 460px; overflow: auto; }
  .cellmap { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .cellmap b { color: var(--text); font-weight: 600; }
  .toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-bottom: 10px; margin-bottom: 6px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .flag { color: var(--skeleton); font-size: 12px; }
</style>
</head>
<body>
<aside>
  <h1>养成素材绘图提示词</h1>
  <p class="hint">骨架是固定规则，对每一张图都一样；主题部分由你填写。改完即时生成提示词，自动保存在本机。</p>

  <div class="btns">
    <button id="exportTxt" class="primary">导出全部提示词 .txt</button>
    <button id="exportJson">导出主题 JSON</button>
    <button id="importJson">导入主题 JSON</button>
    <button id="reset">恢复默认</button>
    <input id="fileJson" type="file" accept=".json,application/json" hidden>
  </div>

  <details class="skeleton" id="skeletonBox">
    <summary>骨架（固定，所有提示词共用）</summary>
    <div id="skeletonFields"></div>
    <p class="hint">骨架改动会影响全部提示词。一般不需要动；如需微调，改这里即可。</p>
  </details>

  <h2>主题（全局）</h2>
  <div id="globalFields"></div>

  <h2>六个收藏槽位</h2>
  <p class="hint">
    槽位的 key 与成长通道由状态层固定（<code>pkg/garden/garden.go</code> 的 <code>defaultItemByChannel</code>），
    内容包只负责把 key 映射成形象与文案。所以<b>槽位数量与 key 不可改，槽位里画什么完全自由</b>——
    六个槽位可以是植物、动物、建筑、机械或任何题材，也可以用下面的预设整体替换。
  </p>
  <div class="grid2" style="margin-bottom:8px">
    <select id="presetSelect"></select>
    <button id="applyPreset">套用题材预设</button>
  </div>
  <div class="btns" style="margin-top:0">
    <button id="clearSlots">清空六个槽位，全部自己填</button>
  </div>
  <div id="elementFields"></div>
</aside>

<main>
  <div class="toolbar">
    <strong>提示词</strong>
    <span class="meta" id="countMeta"></span>
    <button id="copyAll" style="margin-left:auto">复制全部</button>
  </div>
  <div id="cards"></div>
</main>

<script>
'use strict'

const $ = id => document.getElementById(id)
// v2：配色、画风取向与闪光规则整体调整过，旧版存储不再适用（避免读到过期的主题内容）
const STORAGE_KEY = 'garden-art-prompts-v2'

/* ---------------- 骨架 ---------------- */

const DEFAULT_SKELETON = {
  cellSize: '384',
  grid: `格与格之间留出明显空隙；不要画格线、边框、分割线、文字、数字、箭头、水印或任何标注。
所有格都必须有内容，不要留空、不要省略、不要合并。
每格内只放一个主体，主体完整落在格内、不触碰格边，四周留约 10% 空余。
主体下方不要画土壤、地台、基座、花盆或投影：场景里已经有地面，主体从根部直接结束即可。
各格的底部基准必须对齐成一条水平线，不要有的带底座、有的不带。
所有格必须处于同一比例、同一朝向、同一光照方向、同一视平面，底部基准对齐在同一条水平线上。
整体使用同一套有限配色，不额外引入这套配色之外的颜色。

【尺寸下限：每一格会被缩到 64×64，比例 6:1】
- 画之前先按这个比例想一遍：缩小六倍后还能一眼看清的细节才算数，看不清的等于没画。
- 任何装饰（发光点、孢子、果实、露珠、粒子）在源图里直径不小于 16 像素，每格不超过 5 个；宁可少而大，不要多而碎。
- 描边宽度 10–14 像素（缩小后约 2 像素）；小于 6 像素的线一律不要画，它们会消失成杂边。
- 不要画叶脉、绒毛、鳞片这类细纹理：缩减六倍后它们只会变成一片色斑。叶面用两到三档明暗色块表现起伏就够，锯齿只在轮廓上做出明显的一两个缺口。
- 禁止使用细碎的小点、小方块、小碎片来表现发光或质感，会变成噪点。`,
  style: `硬边像素风（高清像素画）：不使用抗锯齿、不使用平滑渐变、不使用模糊和投影，颜色之间是清晰的色块边界。
形体按真实植物学规律安排：叶序、叶脉、菌褶、树皮纹理、卷须螺旋都要合乎实际结构，不做夸张变形。

【配色要有生气，不能寡淡】
- 每个物种有自己的色彩身份，六个物种不要共用同一种绿：见各主体的配色一栏。
- 同一片叶子至少三档明度：受光面、中间调、背光面，相邻两档要能一眼分开；整体明暗差至少两级。
- 高光用暖白或淡黄，不要纯白；暗部用同色系加深，不要直接压黑。
- 轮廓线用比主体更深的同色系（例如深绿轮廓配绿叶），不要用纯黑描边。
- 允许饱满、鲜明的颜色；只要求不刺眼、不荧光，不要求低饱和。

【剪影要能认出来】
- 六个物种的外轮廓形状必须彼此不同：塔形、放射形、伞形、垂坠形、球冠形、缠绕形各占其一。
- 幼年阶段圆润饱满、叶片偏大、头部微微倾斜，显得有生气，让人愿意继续养。
- 花、果实、菌盖、孢子囊是养成的奖励部件：要饱和、面积足够、成为整格最亮的地方；这些部件在源图里宽度不小于 48 像素，花瓣或菌褶的分块要少而大（3–5 片），缩小后仍能一片片数清。
- 好看是普通品质就要做到的，不能靠闪光品质来提供。

主体缩小到最终素材尺寸后仍要辨认清楚（九宫格素材的最终尺寸是 64×64）：结构清晰、剪影可读、色块分明。`,
  usage: `这张图会被等分裁切，每一格单独降采样到 64×64 像素后作为养成系统的游戏素材使用。
因此请以"缩小后仍然好看"为目标：宁可结构简洁清楚，不要堆细节。
背景保持纯透明（若无法输出透明底，则使用单一纯色底，不要渐变、不要纹理、不要阴影）。`,
  sceneCanvas: `输出 1536×512 的横版整幅画面：这是一张完整的场景图，不是九宫格，画面内不要有任何分割。
不要画边框、外框、四角装饰、文字、数字、水印或任何标注。
构图要能承受左右轻微裁切：重要内容不要贴边。`,
  sceneUsage: `这张图会作为养成场景的背景整体使用，宽度会缩放到面板宽度。
画面内不要出现居中的人物、角色或 UI 元素。
地面区域要保持色块平整、不要堆叠细碎纹理，因为会有单独的伙伴素材立在地面上。
背景不要留透明孔洞，整幅画面铺满。`,
}

  shinyRule: `闪光个体：形体、比例、阶段、视线高度、光照方向必须与普通个体完全一致，但必须一眼看出是"同一株的更好版本"，而不是"另一个东西"。

【必备三件套，缺一不可，按重要性排序】
① 整株最外一轮轮廓的淡金发光描边，宽度 10–14 像素（缩小后约 2 像素）——这是最强、最可靠的稀有信号，必须做到；如果只能做到一件事，就做这一件。
② 奖励部件（花、花心、果实、菌盖、菌褶、孢子囊）由普通色升为亮金或深宝石色，并带内部发光，成为整格最亮处；孢子囊这类小部件同时放大一档、更圆更饱满。
③ 主色在同一色系内加深加浓一档，明暗对比再拉开一级，叶片更饱满、更有光泽。注意是「更浓郁」不是「更亮更淡」：整体亮度不能高于普通版，否则看起来像被晒白了，而不是变珍贵。

【成熟形态】
比普通版更繁盛：多 1–2 串花或果实，叶片更饱满紧凑；骨架结构、枝条数量与走向不变。

【核心原则：稀有 = 升级，不是换色系】
不要把普通版的配色整体换到另一个色系（例如绿改成青玉配品红）。那只是"不一样"，喜欢普通版的人未必喜欢闪光版，等于把审美风险丢给玩家。正确做法是在同一色系里往更浓郁、更华丽的方向走。

【禁止】
- 不要换成撞色或对比色组合（例如青玉配品红、蓝配橙）；
- 不要用大面积金属色包裹主体，不要给每个叶簇、每根枝杈都描金；
- 不要变成霓虹感、赛博感；
- 不要用"把颜色调冷、去饱和"来表现闪光，那看起来只是褪色。`,

/* ---------------- 状态与存储 ---------------- */

// 本次定稿的六个槽位全部原地生长，没有巡游与飞行元素。
const DEFAULT_PLACEMENT = {}
for (const element of ELEMENTS) element.placement = DEFAULT_PLACEMENT[element.key] ?? 'ambient'

const state = {
  skeleton: { ...DEFAULT_SKELETON },
  global: { ...DEFAULT_GLOBAL },
  elements: deepClone(ELEMENTS),
}

function deepClone(value) { return JSON.parse(JSON.stringify(value)) }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY)
    if (!raw) return
    const saved = JSON.parse(raw)
    if (saved.skeleton) state.skeleton = { ...DEFAULT_SKELETON, ...saved.skeleton }
    if (saved.global) state.global = { ...DEFAULT_GLOBAL, ...saved.global }
    if (Array.isArray(saved.elements) && saved.elements.length === ELEMENTS.length) state.elements = saved.elements
  } catch { /* 读取失败就用默认值 */ }
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)) } catch { /* 隐私模式下静默 */ }
}

/* ---------------- 提示词构建 ---------------- */

/* 每格像素是固定值，画布尺寸由列数 × 行数推导，保证格子大小完全一致且能被整除。
   形状表优先选"格数正好装下"的矩形，只有素数（5、7）才空一格。 */
const GRID_SHAPES = { 2: [2, 1], 3: [3, 1], 4: [2, 2], 5: [3, 2], 6: [3, 2], 7: [4, 2], 8: [4, 2], 9: [3, 3] }

function gridLayout(count) {
  const fallback = Math.ceil(Math.sqrt(count))
  const [columns, rows] = GRID_SHAPES[count] ?? [fallback, Math.ceil(count / fallback)]
  const cell = Math.max(64, Math.round(Number(state.skeleton.cellSize) || 384))
  return { count, columns, rows, cell, width: columns * cell, height: rows * cell, blanks: columns * rows - count }
}

function canvasLine(layout) {
  const shape = `${layout.columns} 列 × ${layout.rows} 行共 ${layout.columns * layout.rows} 格`
  const tail = layout.blanks > 0
    ? `前 ${layout.count} 格有内容，最后 ${layout.blanks} 格保持空白（与背景一致，不要画任何东西）。`
    : '每格都要有内容。'
  return `【画布与网格】输出 ${layout.width}×${layout.height} 的图片，等分为 ${shape}，每格 ${layout.cell}×${layout.cell}。${tail}\n${state.skeleton.grid}`
}

function skeletonBlock(kind = 'grid', layout = null) {
  const head = kind === 'scene' ? `【画布与网格】\n${state.skeleton.sceneCanvas}` : canvasLine(layout)
  const usageBlock = kind === 'scene' ? state.skeleton.sceneUsage : state.skeleton.usage
  return `${head}\n\n【画风】\n${state.skeleton.style}\n\n【用途与交付】\n${usageBlock}`
}

function subjectPrompt(element, quality) {
  const shiny = quality === 'shiny'
  const g = state.global
  const layout = gridLayout(9)
  const cells = [
    `第 1 行：第 1 格 = 阶段 1（${element.labels[0]}）、第 2 格 = 阶段 2（${element.labels[1]}）、第 3 格 = 阶段 3（${element.labels[2]}）`,
    `第 2 行：第 4 格 = 阶段 4（${element.labels[3]}）、第 5 格 = 阶段 5（${element.labels[4]}）、第 6 格 = 阶段 6（${element.labels[5]}，成熟形态 A）`,
    `第 3 行：第 7 格 = 成熟形态 B、第 8 格 = 成熟形态 C、第 9 格 = 成熟形态 D`,
  ]
  const stageLines = element.stages.map((text, i) => `阶段 ${i + 1}（${element.labels[i]}）：${text}`).join('\n')
  return `${skeletonBlock('grid', layout)}

【主题】${g.themeName} · ${g.genre}
整体色调：${g.paletteMood}
${shiny ? g.shinyRule : `普通个体：使用该题材自然的健康配色，明亮、干净、层次分明。
禁止任何形式的发光：不要光晕、不要外发光描边、不要星形光点、不要悬浮粒子、不要把花或果实画成自己会发光的球。
发光与光效是闪光品质独有的区分标志，普通品质出现发光会直接削弱闪光的存在感。`}

【本张要画什么】
主体：${element.name}（${element.kind}）
外形：${element.look}
寓意（供你理解气质，不要画成文字）：${element.meaning}
配色：${shiny ? element.shinyColors : element.colors}

【九格内容】
${cells.join('\n')}

【阶段 1–6（第 1–6 格）】
${stageLines}
要求：六格是同一主体的六个生长阶段，按 1→6 依次变大、变复杂、变成熟；不要出现形态倒退或题材突变。

【成熟形态 A–D（第 6–9 格）】
这四格是同一成熟形态的四个变体，只允许在少数细节上不同，例如：
花或菌盖的数量与朝向、果实或孢子簇的多少、叶片的疏密、枝条的伸展角度、一两处小装饰的取舍。
轮廓、整体比例、配色、视线高度、光照方向必须完全一致，四个变体要一眼看出是同一个体的同一阶段。
系统会按个体随机选用其中一个，让不同个体的成熟形态略有差异。

【交付】
整张图会被等分裁切，九格各自独立成一张素材：第 1–6 格是六个阶段，第 6–9 格是成熟形态的变体池。
因此每一格都必须完整、居中、互不重叠，也不要跨格延伸。`
}

function clipPrompt(element, clip) {
  const frames = clip.frames
  const layout = gridLayout(frames)
  const cells = []
  for (let i = 0; i < layout.columns * layout.rows; i++) {
    cells.push(i < frames ? `第 ${i + 1} 格 = 第 ${i + 1} 帧` : `第 ${i + 1} 格留空`)
  }
  const rows = []
  for (let r = 0; r < layout.rows; r++) {
    rows.push(`第 ${r + 1} 行：` + cells.slice(r * layout.columns, r * layout.columns + layout.columns).join('、'))
  }
  return `${skeletonBlock('grid', layout)}

【主题】${state.global.themeName} · ${state.global.genre}
整体色调：${state.global.paletteMood}

【本张要画什么】
主体：${element.name}（${element.kind}）的成熟形态（阶段 6）
外形：${element.look}
配色：${element.colors}
动作：${clip.label || ACTION_LABEL[clip.key]}（${clip.key}），共 ${frames} 帧，循环播放
动作要点：${clip.note}

【格位内容】
${rows.join('\n')}

【动画要求】
每一帧的主体大小、朝向、位置基准必须完全一致，只有肢体与重心按动作要点变化。
第 1 帧与第 ${frames} 帧要能自然衔接成循环。
主体保持统一的观看方向，不要中途翻转。
留空的格必须与背景一致，不要补画任何内容。

【交付】
整张图只用于裁切出这 ${frames} 帧，帧序按行优先（从左到右、从上到下）。`
}

function scenePrompt(quality) {
  const g = state.global
  const night = quality === 'night'
  // 只有存在对应放置类型的元素时，才在提示词里要求那一带可用
  const usesGround = state.elements.some(element => element.placement !== 'air-roaming')
  const usesAir = state.elements.some(element => element.placement === 'air-roaming')
  const zones = [usesGround ? g.zoneGround : null, usesAir ? g.zoneAir : null].filter(Boolean)
  const subjects = state.elements.some(element => element.placement === 'air-roaming')
    ? '不要画任何动植物或建筑主体，也不要画居中的人物或角色——这些由单独的素材叠加。'
    : '不要画任何植物、菌类或建筑主体，也不要画居中的人物或角色——这些由单独的素材叠加。'
  return `${skeletonBlock('scene')}

【主题】${g.themeName} · ${g.genre}
整体色调：${g.paletteMood}
光照：${night ? g.lightNight : g.lightDay}

【内容】
${night ? '夜晚版本。' : '白天版本。'}
${night ? g.sceneNight : g.sceneDay}

【活动区（不要画出边界线，只需保证这些位置适合放置主体）】
${zones.join('\n')}

【不要画的东西】
${subjects}
不要画文字、标识、UI 元素、边框，不要在四角加装饰纹样。`
}

function buildAll() {
  const list = []
  for (const element of state.elements) {
    const grid = gridLayout(9)
    const subjectCells = `九宫格 ${grid.columns}×${grid.rows}（${grid.width}×${grid.height}）：第 1–6 格为阶段 1–6，第 6–9 格为成熟形态 A–D`
    list.push({ id: `${element.key}-stages`, title: `${element.name} · 普通形态六阶段与成熟变体`, cells: subjectCells, text: subjectPrompt(element, 'normal') })
    list.push({ id: `${element.key}-shiny`, title: `${element.name} · 闪光形态六阶段与成熟变体`, cells: subjectCells, text: subjectPrompt(element, 'shiny') })
    for (const clip of element.clips) {
      const grid = gridLayout(clip.frames)
      const blank = grid.blanks > 0 ? `，其余 ${grid.blanks} 格留空` : ''
      list.push({ id: `${element.key}-${clip.key}`, title: `${element.name} · ${clip.label || ACTION_LABEL[clip.key]}（${clip.frames} 帧）`, cells: `网格 ${grid.columns}×${grid.rows}（${grid.width}×${grid.height}）：行优先排列 ${clip.frames} 帧${blank}`, text: clipPrompt(element, clip) })
    }
  }
  list.push({ id: 'scene-day', title: `${state.global.themeName} · 白天场景`, cells: '单幅横版 1536×512', text: scenePrompt('day') })
  list.push({ id: 'scene-night', title: `${state.global.themeName} · 夜晚场景`, cells: '单幅横版 1536×512', text: scenePrompt('night') })
  return list
}

/* ---------------- 编辑界面 ---------------- */

function field(labelText, value, onInput, options = {}) {
  const wrap = document.createElement('label')
  wrap.className = 'field'
  const span = document.createElement('span')
  span.textContent = labelText
  const input = options.multiline ? document.createElement('textarea') : document.createElement('input')
  if (!options.multiline) input.type = 'text'
  input.value = value
  input.addEventListener('input', () => { onInput(input.value); save(); render() })
  wrap.append(span, input)
  return wrap
}

function skeletonEditor() {
  const host = $('skeletonFields')
  host.textContent = ''
  host.append(
    field('每格像素（画布尺寸由此推导）', state.skeleton.cellSize, v => { state.skeleton.cellSize = v }),
    field('网格规则（九宫格素材）', state.skeleton.grid, v => { state.skeleton.grid = v }, { multiline: true }),
    field('画布规则（整幅场景）', state.skeleton.sceneCanvas, v => { state.skeleton.sceneCanvas = v }, { multiline: true }),
    field('画风规则（共用）', state.skeleton.style, v => { state.skeleton.style = v }, { multiline: true }),
    field('用途与交付（九宫格素材）', state.skeleton.usage, v => { state.skeleton.usage = v }, { multiline: true }),
    field('用途与交付（整幅场景）', state.skeleton.sceneUsage, v => { state.skeleton.sceneUsage = v }, { multiline: true }),
  )
}

function globalEditor() {
  const host = $('globalFields')
  host.textContent = ''
  const keys = [
    ['themeName', '主题名'], ['genre', '题材与环境'], ['paletteMood', '整体色调'],
    ['lightDay', '白天光照'], ['lightNight', '夜晚光照'],
    ['sceneDay', '白天场景内容', true], ['sceneNight', '夜晚场景内容', true], ['shinyRule', '闪光个体规则', true],
    ['zoneGround', '地面活动区（放置地面主体）', true], ['zoneAir', '空中活动区（放置飞行主体）', true],
  ]
  for (const [key, label, multiline] of keys) {
    host.append(field(label, state.global[key], v => { state.global[key] = v }, { multiline }))
  }
}

function elementEditor() {
  const host = $('elementFields')
  host.textContent = ''
  state.elements.forEach((element, index) => {
    const box = document.createElement('details')
    const summary = document.createElement('summary')
    summary.textContent = `${element.name} · ${element.kind}`
    box.append(summary)
    const body = document.createElement('div')

    const keyNote = document.createElement('p')
    keyNote.className = 'hint'
    keyNote.innerHTML = `槽位 key：<code>${escapeHtml(element.key)}</code> · 成长通道 <code>${escapeHtml(element.channel)}</code> — 这两项由状态层固定，画什么完全自由。`
    body.append(keyNote)

    body.append(
      field('名称', element.name, v => { element.name = v; summary.textContent = `${element.name} · ${element.kind}` }),
      field('类别（自由文本：植物/动物/建筑/机械/…）', element.kind, v => { element.kind = v; summary.textContent = `${element.name} · ${element.kind}` }),
      field('外形描述', element.look, v => { element.look = v }, { multiline: true }),
      field('配色', element.colors, v => { element.colors = v }),
      field('闪光配色', element.shinyColors, v => { element.shinyColors = v }),
      field('寓意（影响气质，不会画成文字）', element.meaning, v => { element.meaning = v }),
    )

    // 放置类型：决定可选动作，是内容包契约的硬约束
    const placementWrap = document.createElement('label')
    placementWrap.className = 'field'
    const placementSpan = document.createElement('span')
    placementSpan.textContent = '放置类型（决定可用动作）'
    const placementSelect = document.createElement('select')
    for (const [value, label] of Object.entries(PLACEMENT_LABEL)) {
      const option = document.createElement('option')
      option.value = value
      option.textContent = label
      placementSelect.append(option)
    }
    placementSelect.value = element.placement
    placementSelect.addEventListener('change', () => {
      element.placement = placementSelect.value
      const legal = ACTIONS_BY_PLACEMENT[element.placement]
      element.clips = element.clips.filter(clip => legal.includes(clip.key))
      save(); buildEditors(); render()
    })
    placementWrap.append(placementSpan, placementSelect)
    body.append(placementWrap)

    const stagesTitle = document.createElement('p')
    stagesTitle.className = 'hint'
    stagesTitle.textContent = '六阶段：阶段名 + 该阶段画成什么样'
    body.append(stagesTitle)
    element.stages.forEach((text, stage) => {
      const row = document.createElement('div')
      row.className = 'stage-row'
      const b = document.createElement('b')
      b.textContent = `阶段 ${stage + 1}`
      const labelInput = document.createElement('input')
      labelInput.type = 'text'
      labelInput.value = element.labels[stage]
      labelInput.addEventListener('input', () => { element.labels[stage] = labelInput.value; save(); render() })
      const area = document.createElement('textarea')
      area.value = text
      area.addEventListener('input', () => { element.stages[stage] = area.value; save(); render() })
      row.append(b, labelInput, area)
      body.append(row)
    })

    const clipsTitle = document.createElement('p')
    clipsTitle.className = 'hint'
    clipsTitle.textContent = element.placement === 'ambient'
      ? '动作素材（固定环境可加：待机/进食/睡眠/回应；不加则只画阶段素材）'
      : `动作素材（${PLACEMENT_LABEL[element.placement]}可用：${ACTIONS_BY_PLACEMENT[element.placement].join(' / ')}）`
    body.append(clipsTitle)

    element.clips.forEach((clip, clipIndex) => {
      const row = document.createElement('div')
      row.className = 'stage-row'
      const select = document.createElement('select')
      select.style.flex = '0 0 96px'
      for (const action of ACTIONS_BY_PLACEMENT[element.placement]) {
        const option = document.createElement('option')
        option.value = action
        option.textContent = `${ACTION_LABEL[action]}（${action}）`
        select.append(option)
      }
      select.value = clip.key
      select.addEventListener('change', () => { clip.key = select.value; save(); render() })
      const frames = document.createElement('input')
      frames.type = 'number'
      frames.min = '2'
      frames.max = '9'
      frames.value = String(clip.frames)
      frames.style.flex = '0 0 52px'
      frames.title = '帧数（九宫格最多 9 格）'
      frames.addEventListener('input', () => {
        clip.frames = Math.min(9, Math.max(2, Math.round(Number(frames.value) || 2)))
        save(); render()
      })
      const area = document.createElement('textarea')
      area.value = clip.note
      area.addEventListener('input', () => { clip.note = area.value; save(); render() })
      const remove = document.createElement('button')
      remove.textContent = '删'
      remove.title = '移除这个动作'
      remove.addEventListener('click', () => { element.clips.splice(clipIndex, 1); save(); buildEditors(); render() })
      row.append(select, frames, area, remove)
      body.append(row)
    })

    const add = document.createElement('button')
    add.textContent = '+ 加一个动作'
    add.addEventListener('click', () => {
      const legal = ACTIONS_BY_PLACEMENT[element.placement]
      const used = new Set(element.clips.map(clip => clip.key))
      const next = legal.find(action => !used.has(action)) ?? legal[0]
      element.clips.push({ key: next, label: ACTION_LABEL[next], frames: 4, note: '' })
      save(); buildEditors(); render()
    })
    body.append(add)

    box.append(body)
    if (index === 0) box.open = true
    host.append(box)
  })
}

/* ---------------- 提示词卡片 ---------------- */

function renderCards() {
  const list = buildAll()
  const host = $('cards')
  host.textContent = ''
  $('countMeta').textContent = `共 ${list.length} 张，按素材拆分`
  for (const item of list) {
    const card = document.createElement('section')
    card.className = 'card'
    const header = document.createElement('header')
    const h3 = document.createElement('h3')
    h3.textContent = item.title
    const actions = document.createElement('span')
    const copy = document.createElement('button')
    copy.textContent = '复制'
    copy.addEventListener('click', () => {
      void copyText(item.text)
      copy.textContent = '已复制'
      setTimeout(() => { copy.textContent = '复制' }, 1200)
    })
    actions.append(copy)
    header.append(h3, actions)
    const map = document.createElement('p')
    map.className = 'cellmap'
    map.innerHTML = `<b>格位：</b>${escapeHtml(item.cells)}`
    const pre = document.createElement('pre')
    pre.textContent = item.text
    card.append(header, map, pre)
    host.append(card)
  }
  return list
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true } catch { /* 回退 */ }
  const area = document.createElement('textarea')
  area.value = text
  area.style.position = 'fixed'
  area.style.opacity = '0'
  document.body.append(area)
  area.select()
  const ok = document.execCommand('copy')
  area.remove()
  return ok
}

function render() {
  renderCards()
}

/* ---------------- 导出 ---------------- */

function allPromptText() {
  const list = buildAll()
  const lines = [`# ${state.global.themeName} 绘图提示词`, `# 共 ${list.length} 张：主体阶段（普通/闪光）、动作帧、场景`, '']
  for (const item of list) {
    lines.push('='.repeat(72), `## ${item.title}`, `## 格位：${item.cells}`, '='.repeat(72), '', item.text, '', '')
  }
  return lines.join('\n')
}

function download(name, text, type = 'text/plain') {
  const blob = new Blob([text], { type: type + ';charset=utf-8' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = name
  a.click()
  setTimeout(() => URL.revokeObjectURL(url), 4000)
}

$('exportTxt').addEventListener('click', () => download('garden-art-prompts.txt', allPromptText()))
$('exportJson').addEventListener('click', () => download('garden-art-theme.json', JSON.stringify(state, null, 2), 'application/json'))
$('copyAll').addEventListener('click', async () => {
  await copyText(allPromptText())
  $('copyAll').textContent = '已复制全部'
  setTimeout(() => { $('copyAll').textContent = '复制全部' }, 1400)
})
$('importJson').addEventListener('click', () => $('fileJson').click())
$('fileJson').addEventListener('change', async event => {
  const file = event.target.files?.[0]
  event.target.value = ''
  if (!file) return
  try {
    const saved = JSON.parse(await file.text())
    if (saved.skeleton) state.skeleton = { ...DEFAULT_SKELETON, ...saved.skeleton }
    if (saved.global) state.global = { ...DEFAULT_GLOBAL, ...saved.global }
    if (Array.isArray(saved.elements) && saved.elements.length === ELEMENTS.length) state.elements = saved.elements
    save()
    buildEditors()
    render()
  } catch (error) {
    window.alert('导入失败：' + (error instanceof Error ? error.message : String(error)))
  }
})
$('reset').addEventListener('click', () => {
  state.skeleton = { ...DEFAULT_SKELETON }
  state.global = { ...DEFAULT_GLOBAL }
  state.elements = deepClone(ELEMENTS)
  save()
  buildEditors()
  render()
})

function buildEditors() {
  skeletonEditor()
  globalEditor()
  elementEditor()
  presetSelect()
}

function presetSelect() {
  const select = $('presetSelect')
  if (select.options.length) return
  for (const [id, preset] of Object.entries(THEME_PRESETS)) {
    const option = document.createElement('option')
    option.value = id
    option.textContent = preset.name
    select.append(option)
  }
}

/* 套用题材预设：只替换六个槽位的内容，骨架与全局主题沿用当前值。
   槽位的 key 与通道保持不动——它们由状态层定义。 */
$('applyPreset').addEventListener('click', () => {
  const preset = THEME_PRESETS[$('presetSelect').value]
  if (!preset) return
  if (preset.elements) {
    state.elements = deepClone(preset.elements)
    for (const element of state.elements) element.placement = element.placement ?? 'ambient'
    if (!window.confirm(`套用「${preset.name}」会覆盖当前六个槽位的内容，确定吗？`)) return
    state.global.themeName = preset.name
  } else {
    if (!window.confirm('该预设是当前现役选材，会覆盖六个槽位当前的编辑，确定吗？')) return
    const defaults = deepClone(ELEMENTS)
    for (const element of defaults) element.placement = DEFAULT_PLACEMENT[element.key] ?? 'ambient'
    state.elements = defaults
    state.global.themeName = DEFAULT_GLOBAL.themeName
  }
  save()
  buildEditors()
  render()
})

$('clearSlots').addEventListener('click', () => {
  if (!window.confirm('清空六个槽位的名称、类别、外形、配色与阶段描述？key 与通道会保留，方便你从零填写。')) return
  state.elements = state.elements.map(element => ({
    key: element.key,
    channel: element.channel,
    placement: 'ambient',
    name: '', kind: '', meaning: '', look: '', colors: '',
    labels: ['', '', '', '', '', ''],
    stages: ['', '', '', '', '', ''],
    clips: [],
  }))
  save()
  buildEditors()
  render()
})

load()
buildEditors()
render()
</script>
