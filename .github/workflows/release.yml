name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-shell/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: cmd /c "build_release.bat"
        env:
          CI: true
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create ZIP package
        run: Compress-Archive -Path build/bin/* -Destination opscopilot-windows.zip

      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: opscopilot-windows
          path: opscopilot-windows.zip

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v4
        with:
          name: opscopilot-exe
          path: build/bin/opscopilot.exe

  build-linux-service:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build service center
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags '-s -w' -o opscopilot-service-center-linux-${{ matrix.arch }} ./cmd/service-center

      - name: Upload service binary
        uses: actions/upload-artifact@v4
        with:
          name: opscopilot-service-center-linux-${{ matrix.arch }}
          path: opscopilot-service-center-linux-${{ matrix.arch }}

  release:
    needs: [build-windows, build-linux-service]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opscopilot-*
          path: ./release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/opscopilot-windows.zip
            release/opscopilot.exe
            release/opscopilot-service-center-linux-amd64
            release/opscopilot-service-center-linux-arm64
          # 仓库内 docs/release-notes/<tag>.md 作为 Release 正文；
          # GitHub 自动生成的变更列表附加在其后
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
