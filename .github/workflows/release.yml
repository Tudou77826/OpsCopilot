name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-shell/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: |
          $wailsVersion = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wailsVersion"

      - name: Setup Java for desktop database support
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: jdbc-helper/pom.xml

      - name: Build complete desktop package
        shell: pwsh
        run: |
          ./scripts/build-desktop.ps1 -Version '${{ github.ref_name }}' -OutputDirectory build/desktop-release
          Copy-Item -LiteralPath build/desktop-release/opscopilot-windows.zip -Destination .
          Copy-Item -LiteralPath build/desktop-release/SHA256SUMS.txt -Destination .

      - name: Verify desktop component and update contracts
        run: go test ./pkg/desktopruntime ./pkg/updater ./pkg/installguard ./pkg/servicecenter ./pkg/dbworkspace

      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: opscopilot-windows
          path: opscopilot-windows.zip
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: opscopilot-checksums
          path: SHA256SUMS.txt

  build-linux-service:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build service center
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags '-s -w' -o opscopilot-service-center-linux-${{ matrix.arch }} ./cmd/service-center

      - name: Upload service binary
        uses: actions/upload-artifact@v4
        with:
          name: opscopilot-service-center-linux-${{ matrix.arch }}
          path: opscopilot-service-center-linux-${{ matrix.arch }}

  release:
    needs: [build-windows, build-linux-service]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opscopilot-*
          path: ./release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/opscopilot-windows.zip
            release/SHA256SUMS.txt
            release/opscopilot-service-center-linux-amd64
            release/opscopilot-service-center-linux-arm64
          # 仓库内 docs/release-notes/<tag>.md 作为 Release 正文；
          # GitHub 自动生成的变更列表附加在其后
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
