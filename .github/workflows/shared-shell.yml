name: Shared Shell checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-shell/package-lock.json
            plugins/teams-opscopilot/package-lock.json
      - run: npm --prefix frontend-shell ci
      - run: npm --prefix frontend ci
      - run: npm --prefix plugins/teams-opscopilot ci
      - run: npm --prefix frontend-shell run typecheck
      - run: npm --prefix frontend-shell test -- --maxWorkers=2
      # 样式门禁：裸色值、双主题完整性、皮肤块契约、尺寸令牌引用完整性。
      # 自测先跑，保证门禁规则本身是活的（改了规则却只剩空转时要能发现）。
      # lint:style 只扫 frontend-shell/src（本机快跑用），CI 用全量 :all 连 frontend/src 一起扫。
      - run: npm --prefix frontend-shell run lint:style:self
      - run: npm --prefix frontend-shell run lint:style:all
      - run: npm --prefix frontend test -- --run --maxWorkers=2
      - run: npm --prefix frontend-shell run build
      - run: npm --prefix frontend run build
      - run: npm --prefix plugins/teams-opscopilot run typecheck
      - run: npm --prefix plugins/teams-opscopilot test
      - run: npm --prefix plugins/teams-opscopilot run test:integration
      - run: npm --prefix plugins/teams-opscopilot run package
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/shellsidecar

  shared-storage:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Repeated multi-process storage and installation lifecycle regression
        run: go test -count=3 -timeout=180s -run "Shared|Process|ReadOnly|Merge|Runtime|OtherProcess|LeaseHelper" ./pkg/filetxn ./pkg/installguard ./pkg/config ./pkg/connectionstore ./pkg/script
