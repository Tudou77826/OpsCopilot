<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ops_temp</title>
    <!-- 防 FOUC：在 React 渲染前同步读 localStorage 写 data-theme，让首帧 CSS 变量即正确。
         与 src/components/appearance.ts 的 THEME_STORAGE_KEY / DEFAULT_THEME 保持一致。 -->
    <script>
        try {
            var t = localStorage.getItem('opscopilot-theme') || 'dark';
            if (t !== 'light' && t !== 'dark') t = 'dark';
            document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
